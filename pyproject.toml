[project]
name = "chess-ai-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.0",
    "google-api-python-client>=2.202.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.20",
    "pymilvus>=3.0.2",
    "python-chess>=1.999",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sentence-transformers>=6.2.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
