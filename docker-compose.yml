services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chess-ai-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: chess-ai-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      LICHESS_API_TOKEN: ${LICHESS_API_TOKEN}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
    depends_on:
      milvus:
        condition: service_healthy
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v3.0.5
    container_name: chess-ai-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      DEPLOY_MODE: STANDALONE
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
    ports:
      - "19531:19530"
      - "9092:9091"
    volumes:
      - ./volumes/milvus:/var/lib/milvus
      - ./embedEtcd.yaml:/milvus/configs/embedEtcd.yaml:ro
      - ./user.yaml:/milvus/configs/user.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 10s
      retries: 5
    restart: unless-stopped